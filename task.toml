artifacts = ["/app/remediation/migration.sql", "/app/src/orders.py", "/app/src/gateway.py"]

[task]
name = "afterquery/checkout-cascade"

[metadata]
author_name = "Walter Kibet"
author_email = "kibetwalter726@gmail.com"
difficulty_explanation = """An on-call backend or SRE engineer is given a live checkout incident on a synthetic mobile-commerce stack: three services, a Postgres database of about 400,000 customers, 840,000 orders and 860,000 audit events, and traffic still arriving. All data is generated by the fixtures in this bundle; none of it comes from a real system. The deliverable is one SQL file applied online to a database that stays writable throughout.

The diagnosis is not a lookup. The expensive work is a helper the request traces do not cover, so the spans have to be subtracted to find the gap, and the environment offers several plausible but wrong leads. One hot query is slow because an index exists that the planner cannot use: the predicate filters on lower(status) while the index is partial on status. Another is slow because its predicate sits inside an opaque plpgsql function the planner cannot see through. Three further sources hide in different places. Two are in other services and appear nowhere in the schema, so they are found only by reading those services' source: payment-service counts pending payments on every charge, and inventory-service checks how much a warehouse has taken on in the last hour before every reservation. The fourth is the other way round -- it is a database function that order-service calls on every checkout, so it is invisible to anyone searching the services for SQL and shows up only by following what the checkout path actually calls. Nothing states how many sources there are, so stopping at one, or two, or three leaves the incident partly unfixed.

The remediation is where the task is won or lost. Every figure the risk lookup returns covers a trailing window whose length is an operational setting, not a constant. That breaks the standard answer. A per-customer total kept current by triggers is silently wrong, because a row leaves the window by ageing rather than by being written, so no trigger fires; and discarding history that currently sits outside the window is wrong too, because widening the setting brings it back. What works is per-customer, per-day figures, summed over the days inside the window, with the single day the window's edge falls in read from the base rows so a row stops counting at the second it ages out.

Three cost bounds then decide the shape of the maintenance, and each is met or missed by an order of magnitude rather than narrowly. The lookup must answer in under 5 ms for every customer, including one carrying about 73,000 rows that count. A single-row write must cost no more than twice what it costs for an ordinary customer, and one account holds more than 25,000 counted orders on a single day, so maintenance that rebuilds a customer's figures -- or even just that day's -- cannot meet it; only applying a row's own contribution can. And a complete migration run must fit inside 40 times a single aggregate pass over both tables, which rules out the backfill shape that follows most naturally from the rest of the design, one that visits each of 400,002 customers in turn.

Those bounds pull against correctness. Applying contributions per row means deciding, row by row, whose figure changes and whether the row counts at all, and the original code decides both by plain text comparison: an audit event belongs to a customer only when its payload's customer_id is exactly that customer's id as text, so a zero-padded or space-padded or fractional form belongs to nobody, and an event is dropped only when its action is exactly 'purged'. Reproducing that by parsing the payload instead of comparing it credits customers the original never would. Meanwhile writes keep arriving while the backfill runs and each must land exactly once, deploys can be interrupted or started twice at the same moment, and the database must keep accepting writes throughout.

An agent that reads the brief and writes a careful migration still tends to produce something that is correct on the data it can see and wrong on one of these axes: a total that goes stale when the window setting changes, maintenance that is correct but proportional to a customer's history, a backfill that is correct but too slow, or a write path that resolves payloads by parsing. Each failure is invisible until the specific condition arises. A domain expert should expect a long day: the diagnosis alone takes hours on a live system, and the migration has to be online, re-runnable, interrupt-safe and correct against concurrent writes. One of the figures is a distinct count -- how many warehouses the customer has drawn on inside the window -- and it does not decompose the way the others do. Counts and sums over a day can be added up across days; a warehouse used on three separate days is still one warehouse. Maintaining it therefore needs its own structure, keyed by warehouse as well as day, and a lookup that unions the days rather than adding them, while still reading the window's edge day from the base rows like the rest."""
solution_explanation = """Subtract the child spans from the order-service checkout span; the gap is an untraced risk helper. Read checkout_risk_context and audit_payload_belongs_to through pg_get_functiondef -- both are legitimate, the agent has full schema access. The source shows what the column names do not: every figure covers a trailing window whose length is read from risk_settings, an audit event belongs to a customer only when its payload's customer_id is exactly that customer's id as text, and an order is excluded only when lower(status) is 'canceled'.

Five indexes, each CREATE INDEX CONCURRENTLY at top level: orders on (customer_id, created_at) INCLUDE (total_cents) WHERE lower(status) <> 'canceled'; audit_events on (customer_risk_payload_customer(payload), created_at) WHERE coalesce(payload->>'action','') <> 'purged'; payments on (id) WHERE status = 'pending', for payment-service's per-charge pending count; orders on (warehouse_id, created_at), for the last-hour reservation check inventory-service runs before every reserve; and payments on (created_at) WHERE status = 'failed', for checkout_recent_declines, which order-service calls on every checkout and which joins payments to orders. The first two live only in their services' source; the last lives only in the database. customer_risk_payload_customer maps a payload to the customer it belongs to by accepting a string only if it round-trips through integer, so '0390006', ' 390011' and '390010.0' belong to nobody. Keying the audit index by that resolved customer, rather than by the payload's text, is what lets the backfill scan a whole range of customers at once; text order is not customer order.

Indexes alone are not enough. Reading a customer's in-window rows through them still costs one entry per row, about 73,000 for the largest account, and a single total per customer maintained by triggers is wrong twice over: a row leaves the window by ageing, with no write for a trigger to see, and widening the setting brings rows back that a narrower window excluded. So customer_risk_daily holds one row per customer per UTC day, and every day is kept regardless of the current setting. checkout_risk_context keeps its signature and column names and returns, for each figure, the sum of that customer's day rows strictly after the day the window's edge falls in, plus a count read from the base rows for that edge day alone, from the edge itself to the end of the day. The work is bounded by the window's length in days plus one day of rows, never by the customer's history, and a row stops counting at the second it ages out.

Day rows are maintained by AFTER INSERT/UPDATE/DELETE row triggers that apply each row's own signed contribution -- subtract the old row's, add the new row's, each to its own customer and day -- and never rebuild anything, because a write must cost no more than twice what it costs for an ordinary customer and one account carries over 25,000 counted orders on a single day. Before changing any figure a trigger locks the row of every customer the write touches in customer_risk_summary, lowest id first (INSERT ... ON CONFLICT DO UPDATE on the primary key; that table's values are no longer read, the row is the lock). That ordering is what makes deltas exactly-once against the backfill: a write whose trigger takes the lock first commits before the backfill's recompute takes its snapshot, so the recompute includes it and overwrites the delta with an absolute figure; a write arriving while the backfill holds the lock waits, was invisible to that snapshot, and applies its delta afterwards.

The backfill writes absolute figures 2000 customers at a time: one statement creates and locks the range's summary rows, the next deletes the range's day rows, and the next rebuilds them with one scan per table over that range, grouped by customer and day. Absolute figures make it idempotent; committing per batch keeps live writes moving and keeps a complete run inside the cost budget, which probing each of 400,002 customers in turn does not. Each run first drops any of its five indexes that an interrupted run left invalid, generated with format() and executed through psql's gexec because DROP INDEX CONCURRENTLY cannot run inside a transaction, so an interruption during a build cannot hide behind IF NOT EXISTS. Triggers are installed with CREATE OR REPLACE TRIGGER, which takes ShareRowExclusive, rather than DROP plus CREATE, which would need AccessExclusive on a table under traffic. The whole file runs under a session-level advisory lock, so a second deploy runner starting at the same moment waits and then re-runs everything idempotently instead of colliding on a duplicate object name; it cannot be a transaction, because CREATE INDEX CONCURRENTLY cannot run inside one. The distinct-warehouse figure is kept separately in customer_risk_warehouse_daily, keyed by customer, warehouse and day, because a distinct count cannot be summed across days. The triggers maintain it with the same signed contributions under the same lock, the orders trigger also fires when only warehouse_id changes, and the lookup unions the warehouses of the whole days inside the window with those read from the base rows for the edge day, then counts what is left."""
verification_explanation = """The verifier runs in its own container against a freshly seeded copy of the database, built at verify time from the fixtures in tests/, so every run starts from the same data and the row timestamps are always positioned the same way relative to the risk window. It grades one artifact, the submitted /app/remediation/migration.sql, and also collects order-service's and gateway's source for review. Editing the application cannot help a submission pass: the load stage starts the services from the verifier's own copies, so the only thing that can change the outcome is what the migration does to the database.

Setup establishes the baseline and the conditions the instruction describes. It first times one aggregate pass over orders and audit_events grouped by customer, on the same machine, immediately before the file is applied; the cost budget is a ratio against that number rather than a stopwatch reading, so it does not depend on how fast the hardware is. It then starts two writer sessions issuing checkout-shaped writes -- status flips, monetary corrections, audit events moved between customers, and every twentieth iteration one statement spanning twelve customers -- and applies the file four times while they run: twice interrupted partway through (at 5 and 12 seconds, so an index build is cut off mid-flight), then twice to completion. The order writes are held open across application work so that two sessions genuinely overlap on the same customer, which is what makes lost updates possible at all.

Correctness is checked against a golden query that reproduces the current code path's semantics -- both predicates included, and the window read from the same setting the function reads -- rather than against stored numbers, so it stays right as the data changes underneath. That query is compared, over all four figures including the distinct warehouse count, to the submitted implementation for a sample of customers, for the customers carrying deliberately awkward rows, and for the large account. Separate checks cover what has to remain true afterwards: row counts unchanged; the function's column set unchanged; no sequential scan of orders, payments or audit_events in the plans of the queries checkout issues, which are checked one by one including payment-service's pending count, inventory-service's last-hour reservation check, and the checkout_recent_declines function order-service calls on every checkout; writes reflected exactly once when they land during the migration; figures that follow live writes, corrected timestamps, reassigned orders, bulk statements changing thousands of rows at once (both a status change and, separately, a customer reassignment, so a single-row-per-statement assumption in either direction shows up), customers created after the migration, rows ageing out of the window with nothing written, and the window setting being narrowed and widened. Each of those asserts that the golden figure actually moved before comparing, so none can pass vacuously.

The numeric bounds are calibrated to separate designs rather than to sit near the reference. The risk lookup must answer in under 5 ms median for every customer including one carrying about 73,000 counted rows, roughly an order of magnitude above what the reference needs and far below what reading that customer's rows costs. A single-row write must stay within twice the cost of the same write for an ordinary customer, or 0.6 ms, whichever is larger; the large account has more than 25,000 counted orders on one day, so maintenance proportional to a customer's history misses by several times while constant-time maintenance sits near parity. Both sides of that comparison are timed the same way, statement by statement inside one transaction after an untimed warm-up, so commit cost and cache state enter neither. A complete run must fit inside 40 times the baseline pass. Live writes must not be blocked: the 99th percentile of the writer's own statements, measured across all four applies, must stay under 1.5 seconds, which a backfill holding locks over a large slice of the customer range cannot meet.

Two further checks cover deploy behaviour. After the interrupted runs, no index may be left invalid and no half-built object may remain. And the file is applied six times concurrently, from six threads released together, each with its own copy so the only contention is in the database, serialised through the same session-level advisory lock the design relies on; all six must finish without error and leave the same correct state.

Finally the incident itself is re-measured: 8 checkouts per second from 6 concurrent clients for 60 seconds through the gateway, requiring at most 5 percent errors, p95 under 350 ms, and pool-wait timeouts on at most 2 percent of requests. That window and bound are chosen so the p95 estimate is stable on shared hardware -- a shorter window yields too few requests for p95 to settle, and a tighter bound would turn ordinary scheduling noise into a verdict. A static check on the file's text, with comments stripped and string literals joined, rejects any CREATE INDEX on the three hot tables that is not CONCURRENTLY, wherever it hides. pytest reports through CTRF and the reward is the conjunction of every check: 1 only if all pass, 0 otherwise, including when the file is missing or fails to apply."""
category = "Software"
subcategory = "Systems"
tags = ["debugging", "postgres", "sre", "distributed-systems"]
expert_time_estimate_hours = 12
relevant_experience = "I have five years plus experience in building backend services in Python, including performance-sensitive request paths and resource-allocation tooling that sat in front of Postgres. That work meant reading service logs and traces against the SQL that actually ran, watching connection pools and retries under load, and changing queries or indexes only after EXPLAIN showed why a plan was cheap or not. I also implemented a small RDBMS with CRUD operations, btree-style indexes, joins, updates, deletes, persistence, and a SQL-like execution layer. Building the index and planner pieces is how I learned that a predicate with a cast or an opaque function will not use a column index, and that the fix is to change the predicate (or the function) rather than add an index the planner cannot see. Those two threads are the job this task is asking for: separate a multi-service checkout outage's symptoms from the statement holding the pool, rewrite the live checkout_risk_context function onto keyed columns, and prove the plan and the counts with repeatable tests."
